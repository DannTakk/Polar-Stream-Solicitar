    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor tipo afiche vertical */
        .poster-frame {
            width: 100%;
            max-width: 520px;
            height: 94vh;
            max-height: 880px;
            background: #ffffff;
            padding: 16px;
            box-shadow: 0 25px 60px -15px rgba(0, 183, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .poster-content {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #06101e 0%, #0c2040 40%, #08375e 75%, #185a9d 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Canvas de fondo para partículas y nieve */
        #iceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* SVG de Ciudad Congelada */
        .frozen-city-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            z-index: 1;
            pointer-events: none;
        }

        /* Tipografía de Hielo Helado para el Título */
        .ice-title {
            font-family: 'Cinzel Decorative', 'Outfit', cursive, serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #d4f3ff 30%, #87ceeb 60%, #00bfff 85%, #005f9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.8),
                        0 0 30px rgba(0, 140, 255, 0.5),
                        0 5px 10px rgba(0, 0, 0, 0.7);
            position: relative;
            filter: drop-shadow(0px 4px 8px rgba(0, 30, 60, 0.9));
        }

        /* Estilo de Tarjetas Glassmorphism de Hielo */
        .ice-glass {
            background: rgba(180, 230, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(0, 30, 80, 0.37), inset 0 0 15px rgba(255, 255, 255, 0.4);
            border-radius: 16px;
        }

        /* Animación Flotante para Emojis y Detalles */
        .floating-element {
            animation: float 4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px rgba(135, 206, 235, 0.8));
        }

        .floating-element-slow {
            animation: float 6s ease-in-out infinite alternate-reverse;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.7));
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
            100% { transform: translateY(6px) rotate(-3deg); }
        }

        /* Siluetas de Superhéroes */
        .hero-silhouette {
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.9));
            transition: transform 0.3s ease;
        }
        
        .hero-silhouette:hover {
            transform: scale(1.05);
        }

        /* Tarjetas de Plataformas con Altura Completa y Contorno Luminoso */
        .platform-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .platform-card::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            pointer-events: none;
        }

        .platform-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 240, 255, 0.9);
        }

        /* Modal Expansible con Animación Suave */
        .platform-modal {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .platform-modal.active {

            100% { transform: translateY(10px) scale(0.95) rotate(-5deg); opacity: 0.15; }
        }
        .modal-floating-item {
            animation: modalFloat 5s ease-in-out infinite alternate;
        }
    </style>
</head>

    <script>
        lucide.createIcons();

        // --- SISTEMA DE AUDIO NATIVO (Web Audio API) ---
        let audioCtx = null;
        let bgMusicTimer = null;
        let isAudioInitialized = false;

        function initAudioOnce() {
            if (isAudioInitialized) return;
            isAudioInitialized = true;

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startBackgroundMusic();
            } catch (e) {
                console.log("Audio no soportado o bloqueado");
            }
        }

        // Música de fondo relajante y juguetona (Arpegio en bucle al 100%)
        function startBackgroundMusic() {
            if (!audioCtx) return;

            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23]; // Acordes alegres
            let noteIndex = 0;

            bgMusicTimer = setInterval(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine'; // Tono suave y relajante
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);

                // Volumen al 100% pero con envolvente suave (sin saturar)
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 1200);
        }

        // Sonido de Acierto / Clic al pulsar cualquier celda
        function playClickSound() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // Tono ascendente alegre

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.2);
            } catch(e) {}
        }

        // Sonido de Cancelación / Cerrar ventana
        function playCloseSound() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.2); // Tono descendente

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.22);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.22);
            } catch(e) {}
        }

        // Sonido especial de llamada / WhatsApp
        function playWhatsAppSound() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(950, now);
                osc.frequency.setValueAtTime(1400, now + 0.1); // Doble tono característico de llamada

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            } catch(e) {}
        }

        // --- DATOS Y CONTROL DE PLATAFORMAS ---
        const platformsData = {

        function openPlatform(key) {
            initAudioOnce();
            playClickSound(); // Sonido de acierto al pulsar

            const data = platformsData[key];
            if (!data) return;

            const modal = document.getElementById('platformModal');
            const badge = document.getElementById('modalBadge');
            const title = document.getElementById('modalTitle');
            const price = document.getElementById('modalPrice');
            const btn = document.getElementById('whatsappBtn');
            const emojiBg1 = document.getElementById('modalEmojiBg1');
            const emojiBg2 = document.getElementById('modalEmojiBg2');

            badge.innerText = data.badge;
            badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold uppercase mb-2 border ${data.badgeStyle}`;

            title.innerText = data.title;
            title.className = `text-4xl sm:text-5xl font-black tracking-wider drop-shadow-[0_4px_15px_rgba(0,0,0,0.8)] ${data.titleColor}`;

            price.innerText = data.price;
            price.className = `text-5xl sm:text-6xl font-black tracking-tight drop-shadow-[0_0_25px_rgba(255,255,255,0.6)] ${data.priceColor}`;

            emojiBg1.innerText = data.emoji1;
            emojiBg2.innerText = data.emoji2;

            btn.className = `w-full py-3 rounded-xl font-black text-sm tracking-wider uppercase transition-all shadow-lg flex items-center justify-center gap-2 z-10 transform hover:scale-[1.02] ${data.btnStyle}`;
            
            const mensaje = encodeURIComponent(`Hola, me interesa adquirir la suscripción de ${data.title} (${data.price}).`);
            btn.href = `https://wa.me/584121071800?text=${mensaje}`;

            modal.className = `platform-modal absolute inset-0 z-30 flex flex-col justify-between items-center text-center p-5 backdrop-blur-lg active ${data.bgColor}`;
        }

        function closePlatform() {
            playCloseSound(); // Sonido de cancelación al cerrar
            const modal = document.getElementById('platformModal');
            modal.classList.remove('active');
        }

        // Canvas de Nieve Helada & Destellos
        const canvas = document.getElementById('iceCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const snowflakes = [];
        const numFlakes = 55;

        for (let i = 0; i < numFlakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.5,
                opacity: Math.random() * 0.7 + 0.3,
                speedY: Math.random() * 1.2 + 0.4,
                speedX: Math.random() * 0.6 - 0.3
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snowflakes.length; i++) {
                const flake = snowflakes[i];
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 245, 255, ${flake.opacity})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();

                flake.y += flake.speedY;
                flake.x += flake.speedX;

                if (flake.y > canvas.height) {
                    flake.y = -5;
                    flake.x = Math.random() * canvas.width;
                }
                if (flake.x > canvas.width) flake.x = 0;
                if (flake.x < 0) flake.x = canvas.width;
            }

            requestAnimationFrame(render);
        }

        window.onload = function() {
            render();
        };
    </script>
